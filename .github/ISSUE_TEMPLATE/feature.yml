name: 建议功能
description: 提出一个使用场景或改进建议。
body:
  - type: textarea
    id: context
    attributes:
      label: 你想完成什么
      description: 描述实际的使用场景，以及目前遇到的问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 你希望 Vonvon Bot 怎么做
      description: 如果有暂时可用的替代做法，也可以一起说。
    validations:
      required: true
