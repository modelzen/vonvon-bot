name: CI

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.select.outputs.scope }}
      packages: ${{ steps.select.outputs.packages }}
      platforms: ${{ steps.select.outputs.platforms }}
      ready: ${{ steps.select.outputs.ready }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      target_sha: ${{ steps.select.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify tested source
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Test CI scripts
        run: node --test .github/scripts/*.test.mjs
      - name: Classify changed paths
        id: select
        run: node .github/scripts/ci-scope.mjs
      - name: Check changed-file whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ steps.select.outputs.base }}
          HEAD: ${{ steps.select.outputs.head }}
        run: git diff --check "$BASE" "$HEAD"
      - name: Check dispatched commit whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git show --check --format= HEAD

  linux:
    name: linux
    needs: scope
    if: needs.scope.outputs.ready == 'true' && contains(fromJSON(needs.scope.outputs.platforms), 'linux')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tested source
        env:
          SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: packages/daemon/native/recipe-files/go.sum
      - name: Verify native recipe file transactions
        working-directory: packages/daemon/native/recipe-files
        run: go test ./...
      - run: npm ci
      # The install smoke builds a server package with the Node pinned in scripts/server-node.json; build-server.mjs
      # checks a cached download against that pin before every use.
      - name: Restore pinned server Node
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vonvon-server-node
          key: server-node-${{ hashFiles('scripts/server-node.json') }}
      - name: Run scoped Linux checks
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_PACKAGES: ${{ needs.scope.outputs.packages }}
          VONVON_SMOKE_NODE_CACHE: ${{ runner.temp }}/vonvon-server-node
        run: node .github/scripts/ci-run.mjs

      - name: Verify recipe services against a disposable database
        if: needs.scope.outputs.scope == 'full'
        run: |
          npm ci --prefix services/recipe-api
          npm ci --prefix services/recipe-web
          npm test --prefix services/recipe-api
          npm test --prefix services/recipe-web
          node scripts/recipes/check.mjs

  macos:
    name: macOS checks
    needs: scope
    if: >-
      needs.scope.outputs.ready == 'true' && contains(fromJSON(needs.scope.outputs.platforms), 'macos') &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, modelzen-macos, modelzen-macos-isolated]
    timeout-minutes: 35
    steps:
      - name: Require dedicated isolated CI account
        run: |
          if [ "$(id -un)" != ci-user ]; then
            echo '::error::The macOS runner must use the dedicated ci-user account.'
            exit 1
          fi
          case " $(id -Gn) " in
            *' admin '*)
              echo '::error::The CI account must not be an administrator.'
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tested source
        env:
          SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: packages/daemon/native/recipe-files/go.sum
      - name: Verify native recipe file transactions
        working-directory: packages/daemon/native/recipe-files
        run: go test ./...
      - run: npm ci
      - name: Run scoped macOS checks
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_PACKAGES: ${{ needs.scope.outputs.packages }}
        run: node .github/scripts/ci-run.mjs

  windows:
    name: Windows checks
    needs: scope
    if: needs.scope.outputs.ready == 'true' && contains(fromJSON(needs.scope.outputs.platforms), 'windows')
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.scope.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tested source
        env:
          SOURCE_SHA: ${{ needs.scope.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: packages/daemon/native/recipe-files/go.sum
      - name: Verify native recipe file transactions
        working-directory: packages/daemon/native/recipe-files
        run: go test ./...
      - run: npm ci
      - name: Run scoped Windows checks
        env:
          CI_SCOPE: ${{ needs.scope.outputs.scope }}
          CI_PACKAGES: ${{ needs.scope.outputs.packages }}
        run: node .github/scripts/ci-run.mjs

  gate:
    name: ${{ github.event_name == 'pull_request' && 'CI gate' || 'Manual CI result' }}
    needs: [scope, linux, macos, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify selected checks
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
      - name: Reject stale PR event
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const initial = context.payload.pull_request;
            const { data: current } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: initial.number,
            });
            const selection = pull => pull.labels
              .map(label => label.name)
              .filter(name => ['frozen', 'ci:macos', 'ci:windows', 'ci:all'].includes(name))
              .sort().join(',');
            if (current.head.sha !== initial.head.sha ||
                current.base.sha !== initial.base.sha ||
                current.base.ref !== initial.base.ref ||
                current.draft !== initial.draft ||
                selection(current) !== selection(initial)) {
              throw new Error('PR head, base, draft state, or CI labels changed during this run. Rerun on the current event.');
            }
