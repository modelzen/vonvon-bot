name: PR 251 Windows diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6e54c268072dd9fc0fc33e023ae037145a0c93f8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build --workspace @vonvon/protocol
      - run: npm run build --workspace @vonvon/client
      - name: Read Run query header without exposing registry values
        shell: pwsh
        run: |
          @'
          import { buildSync } from 'esbuild';
          import { execFileSync } from 'node:child_process';
          import { join } from 'node:path';
          buildSync({ entryPoints: ['packages/desktop/src/daemon-dependencies.ts'], outfile: 'windows-parser-probe.mjs', bundle: true, platform: 'node', format: 'esm', packages: 'external' });
          const { parseWindowsRunQuery } = await import('./windows-parser-probe.mjs');
          const key = 'HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run';
          const output = execFileSync(join(process.env.SystemRoot, 'System32', 'reg.exe'), ['query', key], { encoding: 'utf8' });
          const header = output.split(/\r?\n/).find(line => line.trim())?.trim();
          const parsed = parseWindowsRunQuery(output);
          console.log(JSON.stringify({ source: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), header, expected: key.replace('HKCU', 'HKEY_CURRENT_USER'), kind: parsed.kind, reason: parsed.kind === 'unavailable' ? parsed.reason : undefined }));
          '@ | Set-Content -Encoding utf8 probe.mjs
          node probe.mjs
      - name: Recheck unchanged keystore concurrency test
        run: npx vitest run --root packages/daemon test/keystore.test.ts
