name: PR 255 Windows fixture verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9118409d0903489b3dcfab7cf38eebcca3b383fa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build --workspace @vonvon/protocol
      - run: npm run build --workspace @vonvon/client
      - name: Verify exact source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '9118409d0903489b3dcfab7cf38eebcca3b383fa') { throw 'Unexpected source SHA' }
      - name: Exercise Windows process identities, Job boundaries and existing process fixtures
        working-directory: packages/daemon
        run: npx vitest run test/provider/windows-job-breakaway.test.ts test/provider/process-identity.test.ts test/codex-process-tree.test.ts test/import-core.test.ts --maxWorkers=1
