name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI scope rules
        run: node --test .github/scripts/ci-scope.test.mjs
      - name: Classify changed paths
        id: scope
        run: node .github/scripts/ci-scope.mjs
      - name: Check documentation whitespace
        if: steps.scope.outputs.scope == 'docs'
        run: git diff --check "${{ steps.scope.outputs.base }}" "${{ steps.scope.outputs.head }}"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.scope == 'full'
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        if: steps.scope.outputs.scope == 'full'
        run: npm ci
      - name: Build
        if: steps.scope.outputs.scope == 'full'
        run: npm run build
      - name: Typecheck
        if: steps.scope.outputs.scope == 'full'
        run: npm run typecheck
      - name: Test
        if: steps.scope.outputs.scope == 'full'
        run: npm test
      - name: Lint
        if: steps.scope.outputs.scope == 'full'
        run: npm run lint
      - name: Record result
        if: success()
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$SCOPE" = docs ]; then
            echo 'docs: lightweight checks passed; full suite not run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'full: suite passed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  macos:
    name: macOS checks
    needs: linux
    if: >-
      needs.linux.outputs.scope == 'full' &&
      vars.ENABLE_SELF_HOSTED_MACOS_CI == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, modelzen-macos, modelzen-macos-isolated]
    timeout-minutes: 30
    steps:
      - name: Require dedicated CI account
        run: |
          if [ "$(id -un)" != ci-user ]; then
            echo '::error::Use the dedicated ci-user account before enabling macOS CI.'
            exit 1
          fi
          case " $(id -Gn) " in
            *' admin '*)
              echo '::error::The CI account must be a standard user without administrator access.'
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - name: Record tested platform
        if: always()
        run: |
          {
            echo "Source: $(git rev-parse HEAD)"
            echo "Runner: $RUNNER_NAME"
            echo "macOS: $(sw_vers -productVersion), $(uname -m)"
            echo "Node: $(node --version)"
          } >> "$GITHUB_STEP_SUMMARY"
