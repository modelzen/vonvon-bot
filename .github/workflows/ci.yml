name: PR 251 Windows fixture verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b2687603fb2c940177ad644a75fc10845265efae
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build --workspace @vonvon/protocol
      - run: npm run build --workspace @vonvon/client
      - name: Verify exact source
        run: git rev-parse HEAD
      - name: Exercise real npm cancellation and importer lifecycle fixtures
        working-directory: packages/daemon
        run: npx vitest run test/codex-managed-install.test.ts test/import-core.test.ts
