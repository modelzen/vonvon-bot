name: PR 255 Windows fixture verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build --workspace @vonvon/protocol
      - run: npm run build --workspace @vonvon/client
      - name: Verify exact source
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'Unexpected source SHA' }
      - name: Observe exact named Job membership and cleanup
        working-directory: packages/daemon
        run: npx vitest run test/provider/windows-job-breakaway.test.ts --maxWorkers=1
