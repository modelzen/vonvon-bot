name: Windows release build
run-name: ${{ inputs.release_id && format('windows-release {0} {1} {2}', inputs.version, inputs.source_sha, inputs.release_id) || format('Windows release {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA already on main (empty keeps the dispatched ref)
        type: string
      version:
        description: Expected product version for the pinned source
        type: string
      release_id:
        description: Unique orchestration request UUID, used for safe run discovery
        type: string
  push:
    branches: [codex/windows-release-automation, codex/fix-windows-install]

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locate release download caches
        id: download-cache
        run: |
          "electron=$env:LOCALAPPDATA\electron\Cache" >> $env:GITHUB_OUTPUT
          "builder=$env:LOCALAPPDATA\electron-builder\Cache" >> $env:GITHUB_OUTPUT
      - name: Cache official Electron and builder tool downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.download-cache.outputs.electron }}
            ${{ steps.download-cache.outputs.builder }}
          key: release-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Verify source and version
        id: source
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          PINNED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:EXPECTED_SHA) { throw "Checkout SHA mismatch: $sha" }
          if ($env:PINNED_SOURCE_SHA -or $env:EXPECTED_VERSION -or $env:RELEASE_ID) {
            if ($env:PINNED_SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$' -or $env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:RELEASE_ID -notmatch '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$') { throw 'Pinned dispatch requires the complete source SHA, version and request UUID' }
            git merge-base --is-ancestor $sha origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Pinned release source must be on main' }
          }
          $version = node --input-type=module -e "import { checkedProductVersion } from './scripts/product-version.mjs'; console.log(await checkedProductVersion())"
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed' }
          if ($env:EXPECTED_VERSION -and $version -ne $env:EXPECTED_VERSION) { throw 'Pinned product version mismatch' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact=windows-unsigned-$version-$($sha.Substring(0, 12))" >> $env:GITHUB_OUTPUT
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Electron runtime
        run: |
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime installation failed' }
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) { throw 'Electron runtime is missing' }
      - name: Build and check source
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'Typecheck failed' }
          node --test scripts/stage-daemon.test.mjs scripts/windows-runtime-smoke.test.mjs scripts/package-windows.test.mjs scripts/publish-windows.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Package validation tests failed' }
          npm run test -w @vonvon/daemon -- test/environment-windows-launch.test.ts test/provider/windows-command-line.test.ts test/provider/windows-supervisor.test.ts test/windows-owned-process.test.ts test/data-compatibility.test.ts test/register-bot.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Windows daemon tests failed' }
          npm run test -w @vonvon/desktop -- test/windows-updates.test.ts test/tray.test.ts test/daemon-dependencies.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Desktop tests failed' }
      - name: Package unsigned NSIS installer and ZIP
        working-directory: packages/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx --no-install electron-builder --config electron-builder.yml --win nsis zip --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'electron-builder failed' }
      - name: Check installer recovery and failure paths
        run: |
          $cache = Join-Path $env:LOCALAPPDATA 'electron-builder/Cache'
          $compiler = Get-ChildItem -LiteralPath $cache -Recurse -File -Filter makensis.exe | Sort-Object FullName | Select-Object -First 1
          $plugin = Get-ChildItem -LiteralPath $cache -Recurse -File -Filter StdUtils.dll | Where-Object { $_.Directory.Name -eq 'x86-unicode' } | Sort-Object FullName | Select-Object -First 1
          if (-not $compiler -or -not $plugin) { throw 'Packager NSIS tools are missing' }
          node scripts/windows-installer-smoke.mjs $compiler.FullName (Join-Path $PWD 'node_modules/app-builder-lib/templates/nsis/include') $plugin.Directory.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer recovery regression failed' }
      - name: Verify package and write inventory
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          $out = Join-Path $PWD 'packages/desktop/dist/package'
          $zip = Join-Path $out "Vonvon-Bot-$env:RELEASE_VERSION-windows-x64.zip"
          $expanded = Join-Path $env:RUNNER_TEMP 'vonvon-windows-zip'
          Expand-Archive -LiteralPath $zip -DestinationPath $expanded
          $zipExe = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter 'Vonvon Bot.exe')
          if (@($zipExe).Count -ne 1) { throw 'ZIP must contain exactly one Vonvon Bot.exe' }
          $unpackedExe = Join-Path $out 'win-unpacked/Vonvon Bot.exe'
          $stageVersion = (Get-Content 'packages/desktop/stage/package.json' -Raw | ConvertFrom-Json).version
          if ($stageVersion -ne $env:RELEASE_VERSION) { throw 'Staged product version mismatch' }
          $updateConfig = Get-Content 'packages/desktop/stage/dist/windows-update-config.json' -Raw | ConvertFrom-Json
          if (@($updateConfig.PSObject.Properties).Count -ne 0) { throw 'Unsigned build must have empty Windows update configuration' }
          $fileVersion = (Get-Item -LiteralPath $unpackedExe).VersionInfo.FileVersion
          if ($fileVersion -notmatch "^$([regex]::Escape($env:RELEASE_VERSION))(\.0)?$") { throw "Packaged application FileVersion mismatch: $fileVersion" }
          foreach ($exe in @($unpackedExe, $zipExe[0].FullName, (Join-Path $out "Vonvon-Bot-Setup-$env:RELEASE_VERSION-x64.exe"))) {
            $signature = Get-AuthenticodeSignature -LiteralPath $exe
            if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned PE: $exe ($($signature.Status))" }
          }
          if ((Get-FileHash -LiteralPath $unpackedExe -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $zipExe[0].FullName -Algorithm SHA256).Hash) { throw 'ZIP application differs from unpacked application' }
          node scripts/windows-runtime-smoke.mjs "$expanded"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP runtime did not start correctly' }
          $installer = Join-Path $out "Vonvon-Bot-Setup-$env:RELEASE_VERSION-x64.exe"
          $installed = Join-Path $env:RUNNER_TEMP 'Vonvon-installed-smoke'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installed") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'NSIS installation failed' }
          node scripts/windows-runtime-smoke.mjs "$installed"
          if ($LASTEXITCODE -ne 0) { throw 'Installed NSIS runtime did not start correctly' }
          node scripts/package-windows.mjs $out $env:SOURCE_SHA $unpackedExe "$($zipExe[0].FullName)"
          if ($LASTEXITCODE -ne 0) { throw 'Windows release verification failed' }
          Get-Content (Join-Path $out 'windows-release-inventory.json') >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: |
            packages/desktop/dist/package/Vonvon-Bot-Setup-${{ steps.source.outputs.version }}-x64.exe
            packages/desktop/dist/package/Vonvon-Bot-${{ steps.source.outputs.version }}-windows-x64.zip
            packages/desktop/dist/package/Vonvon-Bot-Setup-${{ steps.source.outputs.version }}-x64.exe.blockmap
            packages/desktop/dist/package/latest.yml
            packages/desktop/dist/package/windows-release-inventory.json
          if-no-files-found: error
          retention-days: 30
