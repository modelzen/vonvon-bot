<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light dark">
<title>注册或登录 · Vonvon Bot</title><link rel="icon" href="/mark.png">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/native.css">
<script type="module" src="/native.mjs"></script>
</head><body>
<header class="mast"><div class="bar shell"><a href="/" class="brand"><img src="/mark.png" width="28" height="28" alt="">Vonvon Bot</a></div></header>
<main class="native-shell"><section class="panel" aria-labelledby="title">
<p class="eyebrow">Vonvon Bot</p><h1 id="title">注册或登录</h1>
<p id="status" class="notice" role="status" aria-live="polite">正在准备登录…</p>
<div id="providers" class="provider-list" aria-label="选择登录方式" hidden></div>
<div id="login-help">
<p class="fine">首次使用会自动创建 Vonvon 账号，已有账号会直接登录。</p>
<details class="login-help"><summary>切换账号与授权</summary>
<p>下一步可选择其他 GitHub 或 Google 账号。已授权的账号可能无需再次确认权限。</p>
<p>退出 Vonvon 后，浏览器仍会保留 GitHub 等网站的登录状态。你无需退出这些网站即可选择另一个账号。</p>
</details>
</div>
<button id="cancel" type="button" class="secondary" hidden>取消登录</button>
</section><noscript>请开启 JavaScript 后从 App 重新登录。</noscript></main>
</body></html>
