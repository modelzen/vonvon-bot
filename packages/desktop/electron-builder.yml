appId: com.vonvon.bot.desktop
productName: Vonvon Bot
electronVersion: 44.11.4
electronDist: ../../node_modules/electron/dist
# Non-macOS Electron distributions use hyphenated .pak locale names.
electronLanguages:
  - en-US
  - en-GB
  - zh-CN
  - zh-TW
directories:
  app: stage
  output: dist/package
files:
  - desktop/**
  - dist/update-config.json
  - dist/windows-update-config.json
  - ui/**
  - assets/**
  - package.json
  - "!node_modules/**"
asar: true
afterPack: ../../scripts/desktop-backend-policy.mjs
extraResources:
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: stage/daemon
    to: daemon
    filter:
      - "dist/**/*"
      - "bin/**/*"
      - "package.json"
      - "LICENSE*"
      - "NOTICE"
      - "PROVENANCE.md"
      - "import-core.json"
  - from: stage/ui
    to: ui/dist
    filter:
      - "**/*"
  - from: stage/daemon/node_modules
    to: daemon/node_modules
    filter:
      - "**/*"
  - from: stage/npm
    to: npm
    filter:
      - "**/*"
  - from: stage/npm/node_modules
    to: npm/node_modules
    filter:
      - "**/*"
npmRebuild: false
win:
  extraResources:
    - from: stage/cli
      to: cli
      filter:
        - vonvon.exe
  publish:
    provider: generic
    url: https://dl.vonvon.cc/bot/windows/stable/
  # Update authenticity is checked with the application's pinned Ed25519 key.
  verifyUpdateCodeSignature: false
  icon: assets/windows-icon.ico
  target:
    - nsis
  artifactName: Vonvon-Bot-${version}-windows-${arch}.${ext}
nsis:
  include: assets/windows-installer.nsh
  artifactName: Vonvon-Bot-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: false
  runAfterFinish: true
  createDesktopShortcut: true
  shortcutName: Vonvon Bot
mac:
  # macOS uses .lproj names; electron-builder does not normalize '-' and '_'.
  electronLanguages:
    - en
    - en_GB
    - zh_CN
    - zh_TW
  icon: assets/macos-icon.icns
  category: public.app-category.developer-tools
  # macOS 15 asks before an app reaches the local network (adding a device by its LAN or ZeroTier-type address); this is
  # the sentence the question shows.
  extendInfo:
    NSLocalNetworkUsageDescription: Vonvon Bot 要连接你在同一个网络里添加的设备。Vonvon Bot connects to the devices you add on your network.
  target:
    - dmg
    - zip
