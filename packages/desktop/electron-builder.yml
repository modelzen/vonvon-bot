appId: com.vonvon.bot.desktop
productName: Vonvon Bot
electronVersion: 44.4.5
electronDist: ../../node_modules/electron/dist
# Non-macOS Electron distributions use hyphenated .pak locale names.
electronLanguages:
  - en-US
  - en-GB
  - zh-CN
  - zh-TW
directories:
  app: stage
  output: dist/package
files:
  - desktop/**
  - dist/update-config.json
  - ui/**
  - assets/**
  - package.json
  - "!node_modules/**"
asar: true
afterPack: ../../scripts/desktop-backend-policy.mjs
extraResources:
  - from: stage/daemon
    to: daemon
    filter:
      - "dist/**/*"
      - "bin/**/*"
      - "package.json"
      - "LICENSE*"
      - "NOTICE"
      - "PROVENANCE.md"
      - "import-core.json"
  - from: stage/ui
    to: ui/dist
    filter:
      - "**/*"
  - from: stage/daemon/node_modules
    to: daemon/node_modules
    filter:
      - "**/*"
  - from: stage/npm
    to: npm
    filter:
      - "**/*"
  - from: stage/npm/node_modules
    to: npm/node_modules
    filter:
      - "**/*"
npmRebuild: false
mac:
  # macOS uses .lproj names; electron-builder does not normalize '-' and '_'.
  electronLanguages:
    - en
    - en_GB
    - zh_CN
    - zh_TW
  icon: assets/macos-icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
